<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR-project</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- O Script Oficial da Google para ler o 3D (necessário para funcionar no PC e Android) -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body>

    <!-- CAIXA DO VISUALIZADOR -->
    <div id="caixa-modal" class="modal">
        <div class="modal-content">
            
            <p>Leia o código com a câmara do seu smartphone para colocar o objeto na sua sala.</p>
            
            <img id="qr-image" src="" alt="Código QR">
            
            <button id="btn-fechar-qr" class="btn-text">Voltar ao Visualizador</button>
        </div>
        
        <!-- BOTÃO PARA ABRIR O QR CODE (PC) -->
        <button id="btn-qr-desktop" class="btn-floating">
            VER NO SMARTPHONE
        </button>

        <!-- O MOTOR 3D -->
        <!-- AGORA APONTA DIRETAMENTE PARA O TEU FICHEIRO (Sem bloqueios de segurança) -->
        <model-viewer id="meu-modelo" src="cadeira.glb" ar ar-modes="webxr scene-viewer quick-look" ar-scale="fixed" ar-placement="floor" camera-controls shadow-intensity="1.5" environment-image="neutral" auto-rotate alt="Cadeira de Teste Oficial"></model-viewer>

    </div>

    <!-- JAVASCRIPT -->
    <script>
        const btnAbrir = document.getElementById('btn-abrir-3d');
        const btnFechar = document.getElementById('btn-fechar-3d');
        const modal = document.getElementById('modal-3d');
        const caixaModal = document.getElementById('caixa-modal');
        
        const btnQrDesktop = document.getElementById('btn-qr-desktop');
    </script>
</body>
</html>
